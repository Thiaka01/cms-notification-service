<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <title th:text="${emailSubject}">Notification</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <!--[if mso]>
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td>
  <![endif]-->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e2e8f0;">
          <tr>
            <td style="background-color:#0d4f4f;padding:28px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr th:if="${logoUrl != null and !logoUrl.isEmpty()}">
                  <td style="padding-bottom:16px;">
                    <img th:src="${logoUrl}" alt="Logo" width="180" style="display:block;border:0;max-width:180px;height:auto;"/>
                  </td>
                </tr>
                <tr>
                  <td>
                    <h1 style="margin:0;font-size:22px;font-weight:600;color:#ffffff;line-height:1.3;" th:text="${headerTitle}">Chemical Management System</h1>
                    <p th:if="${headerSubtitle != null and !headerSubtitle.isEmpty()}" style="margin:8px 0 0;font-size:14px;color:#a7f3d0;line-height:1.4;" th:text="${headerSubtitle}"></p>
                  </td>
                </tr>
                <tr th:if="${headerHtml != null and !headerHtml.isEmpty()}">
                  <td style="padding-top:12px;color:#e2e8f0;font-size:14px;line-height:1.5;" th:utext="${headerHtml}"></td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#334155;font-size:16px;line-height:1.6;" th:utext="${bodyHtml}"></td>
          </tr>
          <tr>
            <td style="padding:24px 32px;background-color:#f8fafc;border-top:1px solid #e2e8f0;" th:utext="${footerHtml}"></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  <!--[if mso]>
  </td></tr></table>
  <![endif]-->
</body>
</html>
