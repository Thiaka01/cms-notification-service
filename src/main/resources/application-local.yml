server:
  port: 8099

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cms_notifications_db
    username: postgres
    password: root
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cms-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: localhost
    port: 1025
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/chemical-management

eureka:
  client:
    enabled: false

cms:
  notifications:
    mail:
      enabled: true
